# The required check `verify`: lint, typecheck, build and the smoke tests,
# exactly as `npm run verify` runs them on a laptop. It runs on every pull
# request, and again on main after a merge, where Vercel's Deployment Checks
# wait for it before production takes the domain. See docs/AUTOMATION.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the run before it. Runs on main
  # are never cancelled: each one gates its own deployment.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image, with the browsers and their system libraries
    # already in it. Installing them with `playwright install --with-deps`
    # fetched 185 packages from Ubuntu's mirrors, which the Ubuntu 26.04 runner
    # could not resolve; the step hung until the job timed out. The version must
    # match @playwright/test in package-lock.json, or the tests stop at once
    # saying the browsers are missing.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
